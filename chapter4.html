<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chapter 4 — The Presentation</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="boss-scene">

        <!-- Background decorations -->

        <div class="boss-star star-a">✦</div>
        <div class="boss-star star-b">✧</div>
        <div class="boss-star star-c">✦</div>
        <div class="boss-star star-d">✧</div>


        <!-- Chapter -->

        <div class="chapter-label">
            CHAPTER 04
        </div>


        <!-- Boss battle -->

        <section class="boss-screen">

            <div class="boss-title">
                ⚔️ BOSS BATTLE ⚔️
            </div>


            <h1>
                THE<br>
                PRESENTATION
            </h1>


            <!-- Boss -->

            <div class="presentation-boss"
                 id="presentationBoss">

                <div class="boss-face">
                    👹
                </div>

                <div class="boss-name">
                    PRESENTATION
                    <br>
                    BOSS
                </div>

            </div>


            <!-- Stats -->

            <div class="stats">

                <div class="stat">

                    <span>
                        CONFIDENCE
                    </span>

                    <div class="bar">

                        <div
                            class="bar-fill confidence"
                            id="confidenceBar"
                        ></div>

                    </div>

                </div>


                <div class="stat">

                    <span>
                        NERVES
                    </span>

                    <div class="bar">

                        <div
                            class="bar-fill nerves"
                            id="nervesBar"
                        ></div>

                    </div>

                </div>

            </div>


            <!-- Dialogue -->

            <div class="boss-dialogue">

                <p id="bossText">
                    The Presentation Boss
                    has appeared! 😈
                </p>

            </div>


            <!-- Choices -->

            <div
                class="boss-options"
                id="bossOptions"
            >

                <button id="optionOne">
                    FACE THE BOSS ⚔️
                </button>

            </div>


            <!-- Victory -->

            <div
                class="victory"
                id="victory"
            >

                <div class="victory-icon">
                    🏆
                </div>

                <h2>
                    PRESENTATION
                    COMPLETE!
                </h2>

                <p>
                    +1000 XP
                </p>

                <p>
                    ACHIEVEMENT UNLOCKED
                </p>

                <div class="achievement">
                    🎓 FIRST BOSS DEFEATED
                </div>

                <button id="continueAfterBoss">
                    CONTINUE ❤️
                </button>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
