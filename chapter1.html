<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chapter 1 — Once Upon a Time</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-scene">

        <div class="cloud cloud-one">☁</div>
        <div class="cloud cloud-two">☁</div>

        <div class="sun">☀</div>

        <div class="chapter-label">
            CHAPTER 01
        </div>

        <div class="school">

            <div class="school-roof"></div>

            <div class="school-building">

                <div class="school-sign">
                    SCHOOL
                </div>

                <div class="school-window window-one"></div>

                <div class="school-window window-two"></div>

                <div class="school-door">
                    🚪
                </div>

            </div>

        </div>

        <div class="ground">
            <div class="grass"></div>
        </div>

        <div class="character" id="teacherCharacter">

            <div class="character-head">
                👩🏻
            </div>

            <div class="character-body">
                👗
            </div>

            <div class="character-bag">
                🎒
            </div>

        </div>

        <div class="story-box game-story">

            <p id="storyText">
                Once upon a time...
            </p>

        </div>

        <button id="nextButton">
            CONTINUE ▶
        </button>

    </main>

    <script src="script.js"></script>

</body>

</html>
