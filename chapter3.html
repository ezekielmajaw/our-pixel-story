<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chapter 3 — Day One</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="university-scene">


        <!-- SKY -->

        <div class="uni-cloud cloud-1">
            ☁
        </div>

        <div class="uni-cloud cloud-2">
            ☁
        </div>


        <!-- SUN -->

        <div class="uni-sun">
            ☀
        </div>


        <!-- CHAPTER -->

        <div class="chapter-label">

            CHAPTER 03

        </div>


        <!-- DAY COUNTER -->

        <div class="day-counter">

            DAY 01

        </div>


        <!-- UNIVERSITY -->

        <div class="university">

            <div class="uni-roof"></div>


            <div class="uni-building">


                <div class="uni-sign">

                    UNIVERSITY

                </div>


                <div class="uni-columns">

                    <div></div>
                    <div></div>
                    <div></div>

                </div>


                <div class="uni-door">

                    🚪

                </div>


            </div>

        </div>


        <!-- CHARACTER -->

        <div
            class="student-character"
            id="studentCharacter"
        >

            <div class="student-head">
                👩🏻
            </div>

            <div class="student-body">
                👕
            </div>

            <div class="student-bag">
                🎒
            </div>

        </div>


        <!-- QUEST BOX -->

        <div class="quest-box">

            <div class="quest-title">

                ✦ NEW QUEST UNLOCKED ✦

            </div>


            <div
                class="quest-item"
                id="quest1"
            >

                ☐ Attend your first class

            </div>


            <div
                class="quest-item"
                id="quest2"
            >

                ☐ Meet new people

            </div>


            <div
                class="quest-item"
                id="quest3"
            >

                ☐ Learn something new

            </div>


            <div
                class="quest-item"
                id="quest4"
            >

                ☐ Give your presentation

            </div>

        </div>


        <!-- STORY -->

        <div class="uni-dialogue">

            <p id="uniStory">

                And just like that...

            </p>

        </div>


        <!-- BUTTON -->

        <button id="uniNext">

            CONTINUE ▶

        </button>


    </main>


    <script src="script.js"></script>

</body>

</html>
